<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Link Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 p-8">
  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-6 space-y-4">
    <h1 class="text-2xl font-bold text-center">🔗 Buat Link Pelacakan</h1>
    <form action="/generate" method="POST" class="space-y-4">
      <label class="block">
        <span class="text-gray-700">Tujuan Redirect</span>
        <input type="url" name="target" placeholder="https://google.com" required
               class="mt-1 block w-full rounded-md border-gray-300 shadow-sm"/>
      </label>
      <button type="submit"
              class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
        Buat Link
      </button>
    </form>
  </div>
</body>
</html>
